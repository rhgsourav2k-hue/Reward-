<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewardra PRO Auto Referral</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #results { margin-top: 20px; background: #0f172a; padding: 10px; border-radius: 6px; max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 11px; }
        .log-item { margin-bottom: 6px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Rewardra PRO Bot</h2>
        <label>Referral Code:</label>
        <input type="text" id="refCode" value="DXWOZZLY">
        
        <label>Total Accounts to Create:</label>
        <input type="number" id="totalCount" value="10" min="1" max="50">

        <button onclick="startProcess()" id="subBtn">Start Auto Signup</button>

        <div id="results" style="display:none;"></div>
    </div>

    <script>
        async function startProcess() {
            const ref = document.getElementById('refCode').value;
            const total = parseInt(document.getElementById('totalCount').value);
            const btn = document.getElementById('subBtn');
            const resDiv = document.getElementById('results');

            if(!ref) {
                alert('Please enter referral code');
                return;
            }

            btn.disabled = true;
            resDiv.style.display = 'block';
            resDiv.innerHTML = '<div class="log-item">Starting process...</div>';

            let success = 0;
            let failed = 0;

            for(let i = 1; i <= total; i++) {
                btn.innerText = `Processing ${i}/${total}...`;
                try {
                    let response = await fetch('/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ref: ref })
                    });
                    let data = await response.json();
                    
                    if(data.success) {
                        success++;
                    } else {
                        failed++;
                    }
                    
                    resDiv.innerHTML += `<div class="log-item">${data.log}</div>`;
                    resDiv.scrollTop = resDiv.scrollHeight;
                } catch (err) {
                    failed++;
                    resDiv.innerHTML += `<div class="log-item" style="color:red;">❌ Request error on account ${i}</div>`;
                }
                
                // Thoda delay taaki server load na ho
                await new Promise(r => setTimeout(r, 2000));
            }

            btn.disabled = false;
            btn.innerText = "Start Auto Signup";
            resDiv.innerHTML += `<div style="margin-top:10px; color:#38bdf8; font-weight:bold;">Completed! Success: ${success}, Failed: ${failed}</div>`;
        }
    </script>
</body>
</html>
